<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ozon — Пульт</title>
<link rel="stylesheet" href="assets/dash.css">
</head>
<body>
<div class="wrap">
<div id="navmount"></div>

<h1>Пульт</h1>
<p class="sub" id="subline">Загрузка…</p>
<div class="topbar" id="topbar"></div>

<div id="content">
<div class="loading">Загрузка данных…</div>
</div>

<div class="foot">
  Данные — <code>data/dashboard.json</code>, собирается скриптом <code>build_all.py</code> из ozon-data.
  Формулы прибыли/НДС/кредитов — см. <a href="methodology.html">Методология</a>.
</div>
</div>
<script src="assets/dash.js"></script>
<script>
Dash.loadAll(['data/dashboard.json']).then(function(res){
  const r = res[0];
  if (!r.ok){ Dash.showFatalError('content', ['data/dashboard.json ('+r.error+')']); return; }
  const d = r.data;
  const h = d.header || {};
  document.getElementById('subline').textContent = 'Обновлено ' + (d.generated || '—');
  Dash.setCalculatedAt(d.calculated_at);

  const tb = document.getElementById('topbar');
  const curW = h.current_week;
  tb.innerHTML =
    '<span class="pill">Последний закрытый день: '+Dash.fmtDate(h.last_closed_day)+'</span>'+
    (h.last_full_week ? '<span class="pill">Последняя полная неделя: '+Dash.fmtDate(h.last_full_week.beg)+'—'+Dash.fmtDate(h.last_full_week.end)+'</span>' : '')+
    (curW ? '<span class="pill">Текущая неделя: '+Dash.fmtDate(curW.beg)+'—'+Dash.fmtDate(curW.end)+' · '+(curW.closed?'закрыта':'не завершена')+'</span>' : '');

  const k = d.kpi;
  const kpiHtml =
    '<div class="kpi-grid">'+
      kpiCard('Реализовано', Dash.fmtRub(k.realized.value), k.realized.period, k.realized.delta, null, k.realized.meta)+
      kpiCard('Операционная прибыль Ozon', Dash.fmtRub(k.profit_before.value),
              k.profit_before.pct_of_realized!=null ? Dash.fmtPct(k.profit_before.pct_of_realized)+' от реализованного' : null,
              k.profit_before.delta, null, k.profit_before.meta)+
      kpiCard('Денежный результат после кредитов и расчётного НДС', Dash.fmtRub(k.net.value), null, k.net.delta, null, k.net.meta)+
      kpiCard('Ozon должен нам', Dash.fmtRub(k.ozon_balance.value), k.ozon_balance.payout_note, null, null, k.ozon_balance.meta, 'Баланс')+
      kpiCard('Потенциальные потери, ₽/30 дней', Dash.fmtRub(k.risk_30d.value), k.risk_30d.note, null, null, k.risk_30d.meta)+
    '</div>';

  const probs = d.top_problems.map(function(p){
    return '<div class="problem"><div class="txt">'+Dash.reliabilityTag(p.reliability)+' <b class="name">'+esc(p.type)+' · '+
      esc(p.name||p.object)+'</b><span class="reason">'+esc(p.problem)+'<span class="arrow">→</span>'+esc(p.action)+'</span></div>'+
      '<div class="eff">'+(p.effect_32d!=null ? Dash.fmtRub(p.effect_32d) : '—')+'</div>'+
      '<a class="go" href="actions.html?key='+encodeURIComponent(p.key)+'">В «Действия» →</a></div>';
  }).join('') || '<p class="dim">Нет активных проблем с рассчитанным эффектом.</p>';

  const chart = renderWeekCompare(d.weeks_chart || []);

  const cs = d.cost_structure;
  const csHtml = cs ? [
      ['Реклама', cs.ads], ['Прочее Ozon', cs.other], ['Закупка', cs.zakup],
      ['Расчётный НДС', cs.vat], ['Кредиты', cs.loan],
    ].map(function(x){ return '<div class="rowcard"><div class="grid"><span>'+x[0]+'</span><b>'+Dash.fmtRub(x[1])+'</b></div></div>'; }).join('')
    : '<p class="dim">Нет данных за последнюю полную неделю.</p>';

  const inv = d.inventory_brief || {};
  const invHtml =
    '<div class="kpi-grid">'+
      kpiCard('Запас в закупочных ценах', Dash.fmtRub(inv.cost_value), inv.n_positions+' позиций', null, 'inventory.html', inv.stock_meta, 'Остатки')+
      kpiCard('Замороженный товар', Dash.fmtRub(inv.frozen_cost_value), inv.frozen_n+' SKU без движения '+inv.frozen_threshold_days+'+ дней', null, 'inventory.html', inv.frozen_meta, 'Остатки')+
      kpiCard('Продававшиеся SKU без остатка', inv.zero_recent_sales_n, 'кандидаты на пополнение', null, 'inventory.html', inv.zero_recent_sales_meta)+
      kpiCard('Товар в транзите', inv.in_transit_n+' SKU', null, null, 'inventory.html', inv.in_transit_meta, 'Состояние')+
    '</div>';

  document.getElementById('content').innerHTML =
    kpiHtml +
    '<h2>Требует решения</h2><div class="problem-list">'+probs+'</div>'+
    '<h2>Последняя неделя к предыдущей сопоставимой</h2>'+chart+
    '<h2>Структура расходов — последняя полная неделя</h2><div class="rowcards" style="display:flex">'+csHtml+'</div>'+
    '<h2>Товар и склад — кратко</h2>'+invHtml+
    '<h2>Выполнение задач</h2><p>Открыто: <b>'+d.actions_open_n+'</b> · выполнено: <b>'+d.actions_done_n+'</b> · '+
    '<a href="actions.html">все действия →</a></p>';
}).catch(function(e){ Dash.showFatalError('content', ['dashboard.json ('+e+')']); });

function kpiCard(label, val, sub, delta, moreHref, meta, metaLabel){
  return '<div class="kpi"><div class="lbl">'+esc(label)+'</div><div class="val">'+val+'</div>'+
    (sub ? '<div class="period">'+esc(String(sub))+'</div>' : '')+
    (delta ? '<div class="delta '+Dash.signClass(delta.abs||0)+'">'+Dash.deltaHtml(delta)+'</div>' : '')+
    (meta ? Dash.renderMeta(meta, metaLabel) : '')+
    (moreHref ? '<a class="more" href="'+moreHref+'">подробнее →</a>' : '')+
    '</div>';
}

// Задание №1.6 п.2: большой график по неделям удалён (линии прибыли были нечитаемы
// на фоне масштаба реализации, управленческой информации не давал). Заменён компактным
// сравнением последней ПОЛНОЙ недели с предыдущей СОПОСТАВИМОЙ (та же методика, оба
// периода полные) - без декоративной замены. Источник точных чисел остаётся основная
// недельная таблица (Финансы → По неделям).
function renderWeekCompare(weeks){
  if (weeks.length < 2){
    return '<p class="dim">Недостаточно закрытых сопоставимых недель для сравнения '+
      '(нужно минимум 2 подряд закрытые полные недели по единой методике).</p>';
  }
  const cur = weeks[weeks.length-1], prev = weeks[weeks.length-2];
  const rows = [
    ['Реализовано', 'sales'], ['Операционная прибыль', 'profit_before'], ['Денежный результат', 'net'],
  ];
  const cells = rows.map(function(r){
    const cv = cur[r[1]], pv = prev[r[1]];
    let deltaHtml = '<span class="dim">нет сравнения</span>';
    if (cv!=null && pv!=null){
      const abs = cv-pv, pct = pv ? abs/Math.abs(pv)*100 : null;
      const cls = abs>0?'pos':(abs<0?'neg':'flat');
      deltaHtml = '<span class="'+cls+'">'+(abs>0?'+':'')+Dash.fmt0(abs)+' ₽'+
        (pct!=null ? ' ('+(pct>0?'+':'')+Dash.fmtPct(pct)+')' : '')+'</span>';
    }
    return '<div class="cmp-cell"><div class="lbl">'+r[0]+'</div>'+
      '<div class="row"><span>'+Dash.fmtDate(prev.beg)+'—'+Dash.fmtDate(prev.end)+'</span><b>'+(pv!=null?Dash.fmtRub(pv):'—')+'</b></div>'+
      '<div class="row"><span>'+Dash.fmtDate(cur.beg)+'—'+Dash.fmtDate(cur.end)+'</span><b>'+(cv!=null?Dash.fmtRub(cv):'—')+'</b></div>'+
      '<div class="delta">'+deltaHtml+'</div></div>';
  }).join('');
  return '<div class="cmp-grid">'+cells+'</div>'+
    '<p class="dim" style="font-size:11px;margin:6px 0 0">Точные значения по всем неделям — '+
    '<a href="finance.html#tabsAnchor">Финансы → По неделям</a>.</p>';
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
</script>
</body>
</html>
