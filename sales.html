<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ozon — Продажи</title>
<link rel="stylesheet" href="assets/dash.css">
</head>
<body>
<div class="wrap">
<div id="navmount"></div>

<h1>Продажи</h1>
<p class="sub" id="subline">Загрузка…</p>

<div id="content"><div class="loading">Загрузка данных…</div></div>

<div class="foot">Данные — <code>data/sales.json</code>. Период везде один и тот же — последние закрытые недели/дни.</div>
</div>
<script src="assets/dash.js"></script>
<script>
Dash.loadAll(['data/sales.json']).then(function(res){
  const r = res[0];
  if (!r.ok){ Dash.showFatalError('content', ['data/sales.json ('+r.error+')']); return; }
  const d = r.data;
  document.getElementById('subline').textContent = 'Обновлено ' + (d.generated||'—');

  const weeksTrs = d.weeks.slice().reverse().map(function(w){
    return '<tr><td>'+Dash.fmtDate(w.beg)+'—'+Dash.fmtDate(w.end)+'</td><td>'+Dash.fmtRub(w.realized)+'</td>'+
      '<td class="dim">'+(w.ordered!=null?Dash.fmtRub(w.ordered):'—')+'</td>'+
      '<td>'+(w.qty_sold!=null?Dash.fmt0(w.qty_sold):'—')+'</td>'+
      '<td>'+(w.qty_returned!=null?Dash.fmt0(w.qty_returned):'—')+'</td>'+
      '<td>'+(w.diff!=null?Dash.fmtRub(w.diff):'—')+'</td></tr>';
  }).join('');

  const top20Trs = d.top20.rows.map(function(r,i){
    return '<tr><td>'+(i+1)+'</td><td>'+esc(r.artikul)+'</td><td class="wrap-cell">'+esc(r.name)+'</td>'+
      '<td>'+r.qty+'</td><td>'+Dash.fmtRub(r.revenue_32d)+'</td></tr>';
  }).join('');

  function abcTable(abc, valLabel){
    const tiers = abc.tiers;
    const summary = ['A','B','C'].map(function(t){
      return '<div class="rowcard"><div class="grid"><span>Группа '+t+'</span><b>'+tiers[t].n+' SKU · '+Dash.fmtRub(tiers[t].sum)+'</b></div></div>';
    }).join('');
    const trs = abc.rows.slice(0,30).map(function(row){
      return '<tr><td>'+esc(row.artikul)+'</td><td class="wrap-cell">'+esc(row.name)+'</td><td>'+row.qty_32d+'</td>'+
        '<td>'+Dash.fmtRub(row.value)+'</td><td>'+Dash.fmtPct(row.cum_pct)+'</td>'+
        '<td><span class="badge '+(row.tier==='A'?'ok':row.tier==='B'?'risk':'grey')+'">'+row.tier+'</span></td></tr>';
    }).join('');
    return '<div class="rowcards" style="display:flex;margin-bottom:10px">'+summary+'</div>'+
      '<div class="card scroll"><table><thead><tr><th>Артикул</th><th>Название</th><th>Продано</th>'+
      '<th>'+valLabel+'</th><th>Накопл. %</th><th>Группа</th></tr></thead><tbody>'+trs+'</tbody></table></div>';
  }

  function growthTable(rows, sign){
    const trs = rows.map(function(row){
      return '<tr><td>'+esc(row.artikul)+'</td><td class="wrap-cell">'+esc(row.name)+'</td>'+
        '<td>'+row.qty_old+'</td><td>'+row.qty_new+'</td>'+
        '<td class="'+(sign>0?'pos':'neg')+'">'+(row.qty_delta>0?'+':'')+row.qty_delta+'</td>'+
        '<td>'+Dash.fmtRub(row.revenue_old_est)+'</td><td>'+Dash.fmtRub(row.revenue_new)+'</td></tr>';
    }).join('') || '<tr><td colspan="7" class="dim" style="text-align:center;padding:12px">Нет данных</td></tr>';
    return '<div class="card scroll"><table><thead><tr><th>Артикул</th><th>Название</th>'+
      '<th>Было, шт</th><th>Стало, шт</th><th>Δ шт</th><th>Выручка была (оценка)</th><th>Выручка сейчас</th></tr></thead>'+
      '<tbody>'+trs+'</tbody></table></div>';
  }

  const gd = d.growth_decline || {};
  const gdHtml = gd.available ? (
    '<div class="flag">'+esc(gd.note)+' Период "было": '+esc(gd.period_old)+'. Период "сейчас": '+esc(gd.period_new)+'.</div>'+
    '<h2>Топ роста по SKU (оценка)</h2>'+growthTable(gd.growth, 1)+
    '<h2>Топ падения по SKU (оценка)</h2>'+growthTable(gd.decline, -1)
  ) : '<div class="flag">'+esc(gd.note||'Нет данных для сравнения периодов')+'</div>';

  document.getElementById('content').innerHTML =
    '<div class="kpi-grid">'+
      '<div class="kpi"><div class="lbl">Реализовано, шт (32 дня)</div><div class="val small">'+Dash.fmt0(d.units.total_units_32d)+'</div>'+
      '<div class="period">'+d.units.selling_sku_n+' продающихся SKU</div>'+Dash.renderMeta(d.units.meta)+'</div>'+
      '<div class="kpi"><div class="lbl">Средний реализованный чек</div><div class="val small">'+Dash.fmtRub(d.avg_check)+'</div>'+Dash.renderMeta(d.avg_check_meta)+'</div>'+
      '<div class="kpi"><div class="lbl">Вклад топ-20 SKU в выручку</div><div class="val small">'+Dash.fmtPct(d.top20.pct_of_total)+'</div>'+
      '<div class="period">'+Dash.fmtRub(d.top20.sum)+' за 32 дня</div>'+Dash.renderMeta(d.top20.meta)+'</div>'+
      '<div class="kpi"><div class="lbl">SKU, потерявшие продажи</div><div class="val small">'+d.lost_sellers_n+'</div>'+
      '<div class="period">продавались раньше, сейчас нет остатка</div>'+Dash.renderMeta(d.lost_sellers_meta)+'</div>'+
    '</div>'+
    '<p class="dim" style="font-size:11px">Источник штук: '+esc(d.units.source)+'</p>'+
    '<div class="flag">'+esc(d.ordered_gap_note)+'</div>'+
    (d.qty_days_note ? '<div class="flag">'+esc(d.qty_days_note)+'</div>' : '')+
    '<h2>Реализовано — по неделям (₽ и шт.)</h2>'+
    '<div class="card scroll"><table><thead><tr><th>Неделя</th><th>Реализовано, ₽</th>'+
    '<th>Реализовано (cash-flow), ₽</th><th>Продано, шт</th><th>Возвращено, шт</th><th>Разница ₽</th></tr></thead>'+
    '<tbody>'+weeksTrs+'</tbody></table></div>'+
    '<h2>Топ-20 SKU по выручке (32 дня)</h2>'+
    '<div class="card scroll"><table><thead><tr><th>#</th><th>Артикул</th><th>Название</th><th>Продано, шт</th><th>Выручка</th></tr></thead>'+
    '<tbody>'+top20Trs+'</tbody></table></div>'+
    '<h2>ABC по выручке (32 дня)</h2>'+abcTable(d.abc_revenue, 'Выручка')+
    '<h2>ABC по операционной прибыли (32 дня)</h2>'+
    '<p class="dim" style="font-size:11.5px">Построено только по продающимся SKU с положительной прибылью. '+
    'Убыточных при продаже SKU: <b>'+d.abc_profit.negative_n+'</b> (сумма '+Dash.fmtRub(d.abc_profit.negative_sum)+') — см. «Действия»/«Цены и маржа».</p>'+
    abcTable(d.abc_profit, 'Прибыль')+
    gdHtml;
}).catch(function(e){ Dash.showFatalError('content', ['sales.json ('+e+')']); });
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
</script>
</body>
</html>
