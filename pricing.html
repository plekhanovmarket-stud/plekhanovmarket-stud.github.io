<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>Ozon — Цены и маржа</title>
<link rel="stylesheet" href="assets/dash.css">
</head>
<body>
<div class="wrap">
<div id="navmount"></div>

<h1>Цены и маржа</h1>
<p class="sub" id="subline">Загрузка…</p>

<div id="content"><div class="loading">Загрузка данных…</div></div>

<div class="foot">
  Данные — <code>data/pricing.json</code>. Целевой ДРР 5% — корпоративная цель, не меняется без согласования.
  Методика расчёта безубыточной/целевой цены — <a href="methodology.html">Методология</a>.
</div>
</div>
<script src="assets/dash.js"></script>
<script>
let ROWS = []; let FILTER = 'Все'; let CATEGORY = 'Все';
Dash.loadAll(['data/pricing.json']).then(function(res){
  const r = res[0];
  if (!r.ok){ Dash.showFatalError('content', ['data/pricing.json ('+r.error+')']); return; }
  const d = r.data;
  document.getElementById('subline').textContent = 'Обновлено ' + (d.generated||'—');
  Dash.setCalculatedAt(d.calculated_at);
  ROWS = d.rows;
  const s = d.summary;
  const CATS = ['Все'].concat(d.categories || []);

  const pr = d.price_reaction || {};
  window.__pr = pr;
  const prHtml = pr.available ? (
    '<h2>Изменение цены продавца с '+Dash.fmtDate(pr.baseline_date)+'</h2>'+
    '<p class="dim" style="font-size:11px;margin:0 0 8px">Цена продавца (Контур 2, диагностика) — не путать с '+
    'фактической ценой реализации в таблице ниже. Сумма "эффекта" — оценочная (при тех же продажах, что сейчас), '+
    'не проверенный факт. Нажмите на карточку, чтобы увидеть список SKU.</p>'+
    '<div class="kpi-grid">'+
    reactionCard('raised', 'Подняли цену', pr.raised, 'pos')+
    reactionCard('unchanged', 'Не тронули', pr.unchanged, null)+
    reactionCard('lowered', 'Снизили цену', pr.lowered, pr.lowered.n?'neg':null)+
    '</div><div id="reactionPanel" class="reaction-panel"></div>') : '';

  document.getElementById('content').innerHTML =
    '<div class="kpi-grid">'+
      kpi('SKU в наличии/транзите', s.base_n, null, null, s.meta)+
      kpi('Прибыльные SKU (факт)', s.profitable_n, null, null, s.meta)+
      kpi('Ниже безубыточной цены', s.below_breakeven_n, Dash.fmtRub(s.loss_sum_32d)+'/32д (факт)', 'neg', s.meta)+
      kpi('Низкая маржа', s.low_margin_n, null, null, s.meta)+
      kpi('Недостаточно продаж за период', s.no_actual_sales_n, 'прибыль не считается', null, s.meta)+
      kpi('Без себестоимости', s.no_cost_n, null, null, s.meta)+
      kpi('Целевой ДРР', s.target_drr_pct+'%', 'целевая маржа '+Dash.fmtPct(s.target_margin_pct), null, s.target_drr_meta)+
    '</div>' + prHtml +
    '<h2>SKU</h2>'+
    '<p class="dim" style="font-size:11.5px;margin:0 0 6px">'+esc(d.category_filter_note||'')+
    ' Прибыль/маржа/рекомендация — по фактической средней цене реализации (продажи за вычетом возвратов ÷ '+
    'реализованное количество за вычетом возвратов), не по цене продавца из каталога.</p>'+
    '<div class="filters" id="filters"></div>'+
    '<div class="filters" id="catfilters"></div>'+
    '<div class="card scroll"><table><thead><tr>'+
    '<th>SKU/Артикул</th><th>Название</th><th>Категория</th><th>Факт. цена реализации</th>'+
    '<th>Цена продавца (без Ozon-акции)</th><th>Прибыль/ед. (факт)</th><th>Прибыль/32д (факт)</th>'+
    '<th>Безубыточная</th><th>Целевая</th><th>ДРР факт</th><th>Безубыт. ДРР</th><th>Индекс</th>'+
    '<th>Продано (факт net)</th><th>Рекомендация</th><th>Эффект/32д (факт)</th>'+
    '</tr></thead><tbody id="rowsBody"></tbody></table></div>'+
    '<p class="dim" style="font-size:11px">'+esc(d.breakeven_drr_formula||'')+'</p>'+
    '<p class="dim" style="font-size:11px">'+esc(d.methodology_note||'')+'</p>'+
    buildPriceChanges(d.price_changes);

  document.getElementById('filters').innerHTML = ['Все','Поднять цену','Починить рекламу','ОК','Недостаточно фактических продаж','Нет продаж 28 дней']
    .map(function(f){ return '<button data-f="'+f+'" class="'+(f===FILTER?'on':'')+'">'+f+'</button>'; }).join('');
  document.querySelectorAll('#filters button').forEach(function(b){
    b.onclick = function(){ FILTER=b.dataset.f; renderRows(); };
  });
  document.getElementById('catfilters').innerHTML = CATS.map(function(c){
    return '<button data-c="'+esc(c)+'" class="'+(c===CATEGORY?'on':'')+'">'+esc(c)+'</button>';
  }).join('');
  document.querySelectorAll('#catfilters button').forEach(function(b){
    b.onclick = function(){ CATEGORY=b.dataset.c; renderRows(); };
  });
  document.querySelectorAll('.reaction-btn').forEach(function(b){
    b.onclick = function(){ toggleReaction(b.dataset.group); };
  });
  renderRows();
}).catch(function(e){ Dash.showFatalError('content', ['pricing.json ('+e+')']); });

let openGroup = null;
function toggleReaction(group){
  openGroup = (openGroup===group) ? null : group;
  renderReactionPanel();
}
function reactionCard(group, label, g, cls){
  return '<button type="button" class="reaction-btn" data-group="'+group+'" aria-expanded="false">'+
    '<div class="lbl"><span>'+esc(label)+'</span><span>'+(openGroup===group?'▾':'▸')+'</span></div>'+
    '<div class="val small'+(cls?' '+cls:'')+'">'+g.n+'</div>'+
    (g.n ? '<div class="period">'+(g.effect_32d>0?'+':'')+Dash.fmtRub(g.effect_32d)+'/32д</div>' : '')+
    '</button>';
}
function renderReactionPanel(){
  const panel = document.getElementById('reactionPanel');
  if (!panel) return;
  document.querySelectorAll('.reaction-btn').forEach(function(b){
    b.setAttribute('aria-expanded', b.dataset.group===openGroup ? 'true' : 'false');
    b.querySelector('.lbl span:last-child').textContent = b.dataset.group===openGroup ? '▾' : '▸';
  });
  if (!openGroup){ panel.innerHTML = ''; return; }
  const g = window.__pr[openGroup];
  panel.innerHTML = '<p class="dim" style="font-size:12px;margin:8px 0 4px">Строк в списке: <b>'+
    g.rows.length+'</b> (совпадает с числом на карточке: <b>'+g.n+'</b>)</p>'+
    '<div class="card scroll"><table><thead><tr><th>SKU/Артикул</th><th>Название</th>'+
    '<th>Дата изменения</th><th>Цена продавца была</th><th>Цена продавца стала</th><th>Δ ₽</th><th>Δ %</th></tr></thead><tbody>'+
    g.rows.map(function(e){
      return '<tr><td>'+esc(e.artikul)+'</td><td class="wrap-cell">'+esc(e.name)+'</td>'+
        '<td>'+(e.change_date ? Dash.fmtDate(e.change_date) : Dash.naText(e.change_date_note))+'</td>'+
        '<td>'+Dash.fmtRub(e.old_price)+'</td><td>'+Dash.fmtRub(e.new_price)+'</td>'+
        '<td class="'+Dash.signClass(e.delta_abs||0)+'">'+(e.delta_abs>0?'+':'')+Dash.fmtRub(e.delta_abs)+'</td>'+
        '<td class="'+Dash.signClass(e.delta_abs||0)+'">'+(e.delta_pct>0?'+':'')+Dash.fmtPct(e.delta_pct)+'</td></tr>';
    }).join('') + '</tbody></table></div>';
}

function renderRows(){
  let rows = FILTER==='Все' ? ROWS : ROWS.filter(function(r){return r.action===FILTER;});
  if (CATEGORY!=='Все') rows = rows.filter(function(r){return r.category===CATEGORY;});
  rows = rows.slice(0,300);
  document.getElementById('rowsBody').innerHTML = rows.map(function(r){
    return '<tr><td>'+esc(r.artikul)+'</td><td class="wrap-cell">'+esc(r.name)+'</td><td>'+esc(r.category||'—')+'</td>'+
      '<td>'+(r.actual_avg_price!=null?Dash.fmtRub(r.actual_avg_price):Dash.naText('нет фактических продаж за период'))+'</td>'+
      '<td class="dim">'+(r.price_diag_seller_base!=null?Dash.fmtRub(r.price_diag_seller_base):'—')+'</td>'+
      '<td class="'+Dash.signClass(r.margin_now||0)+'">'+(r.margin_now!=null?Dash.fmtRub(r.margin_now):'—')+'</td>'+
      '<td>'+(r.margin_now_total_32d!=null?Dash.fmtRub(r.margin_now_total_32d):'—')+'</td>'+
      '<td>'+(r.breakeven_target!=null?Dash.fmtRub(r.breakeven_target):'—')+'</td>'+
      '<td>'+(r.target_price!=null?Dash.fmtRub(r.target_price):'—')+'</td>'+
      '<td>'+Dash.fmtPct(r.drr_fact)+'</td>'+
      '<td>'+(r.breakeven_drr!=null?Dash.fmtPct(r.breakeven_drr):'—')+(r.already_unprofitable_at_zero_ads?' <span class="badge bad">убыток без рекламы</span>':'')+'</td>'+
      '<td>'+esc(r.price_index_color||'—')+'</td><td>'+(r.qty_net_32d!=null?r.qty_net_32d:r.qty_32d)+'</td>'+
      '<td>'+actionBadge(r.action)+'</td><td>'+(r.effect_32d?Dash.fmtRub(r.effect_32d):'—')+'</td></tr>';
  }).join('') || '<tr><td colspan="15" class="dim" style="text-align:center;padding:14px">Нет строк</td></tr>';
}
function actionBadge(a){
  const cls = a==='Поднять цену' ? 'bad' : a==='Починить рекламу' ? 'risk' : a==='ОК' ? 'ok' :
              a==='Недостаточно фактических продаж' ? 'grey' : 'grey';
  return '<span class="badge '+cls+'">'+esc(a)+'</span>';
}
function buildPriceChanges(pc){
  if (!pc || !pc.available) return '<h2>Было → стало (изменения цены)</h2><p class="dim">'+esc((pc&&pc.note)||'Нет данных')+'</p>';
  const trs = pc.rows.map(function(c){
    return '<tr><td>'+Dash.fmtDate(c.date)+'</td><td>'+esc(c.offer_id)+'</td><td class="wrap-cell">'+esc(c.name)+'</td>'+
      '<td>'+Dash.fmtRub(c.old_price)+'</td><td>'+Dash.fmtRub(c.new_price)+'</td>'+
      '<td class="'+Dash.signClass(c.delta_abs||0)+'">'+(c.delta_abs>0?'+':'')+Dash.fmtRub(c.delta_abs)+' ('+Dash.fmtPct(c.delta_pct)+')</td></tr>';
  }).join('');
  return '<h2>Цена продавца — было → стало (изменения за 30 дней)</h2>'+
    '<p class="dim" style="font-size:12px">Цена продавца по каталогу (Контур 2, диагностика — не фактическая цена '+
    'реализации). История ведётся с '+Dash.fmtDate(pc.tracking_started_from)+
    ' — более ранние изменения не восстановить. Всего записей: '+pc.n+'.</p>'+
    '<div class="card scroll"><table><thead><tr><th>Дата</th><th>Артикул</th><th>Название</th>'+
    '<th>Цена продавца была</th><th>Цена продавца стала</th><th>Дельта</th></tr></thead>'+
    '<tbody>'+trs+'</tbody></table></div>';
}
function kpi(label, val, sub, cls, meta){
  return '<div class="kpi"><div class="lbl">'+esc(label)+'</div><div class="val small'+(cls?' '+cls:'')+'">'+val+'</div>'+
    (sub?'<div class="period">'+esc(String(sub))+'</div>':'')+
    (meta ? Dash.renderMeta(meta) : '')+'</div>';
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
</script>
</body>
</html>
