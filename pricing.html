<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>Ozon — Цены и маржа</title>
<link rel="stylesheet" href="assets/dash.css">
</head>
<body>
<div class="wrap">
<div id="navmount"></div>

<h1>Цены и маржа</h1>
<p class="sub" id="subline">Загрузка…</p>

<div id="content"><div class="loading">Загрузка данных…</div></div>

<div class="foot">
  Данные — <code>data/pricing.json</code>. Целевой ДРР 5% — корпоративная цель, не меняется без согласования.
  Методика расчёта безубыточной/целевой цены — <a href="methodology.html">Методология</a>.
</div>
</div>
<script src="assets/dash.js"></script>
<script>
let ROWS = []; let FILTER = 'Все'; let CATEGORY = 'Все';
Dash.loadAll(['data/pricing.json']).then(function(res){
  const r = res[0];
  if (!r.ok){ Dash.showFatalError('content', ['data/pricing.json ('+r.error+')']); return; }
  const d = r.data;
  document.getElementById('subline').textContent = 'Обновлено ' + (d.generated||'—');
  Dash.setCalculatedAt(d.calculated_at);
  ROWS = d.rows;
  const s = d.summary;
  const CATS = ['Все'].concat(d.categories || []);

  const pr = d.price_reaction || {};
  window.__pr = pr;
  const prHtml = pr.available ? (
    '<h2>Изменение цены продавца с '+Dash.fmtDate(pr.baseline_date)+'</h2>'+
    '<p class="dim" style="font-size:11px;margin:0 0 8px">Цена продавца (Контур 2, диагностика) — не путать с '+
    'фактической ценой реализации в таблице ниже. Сумма "эффекта" — оценочная (при тех же продажах, что сейчас), '+
    'не проверенный факт. Нажмите на карточку, чтобы увидеть список SKU.</p>'+
    '<div class="kpi-grid">'+
    reactionCard('raised', 'Подняли цену', pr.raised, 'pos')+
    reactionCard('unchanged', 'Не тронули', pr.unchanged, null)+
    reactionCard('lowered', 'Снизили цену', pr.lowered, pr.lowered.n?'neg':null)+
    '</div><div id="reactionPanel" class="reaction-panel"></div>') : '';

  document.getElementById('content').innerHTML =
    '<div class="kpi-grid">'+
      kpi('SKU в наличии/транзите', s.base_n, null, null, s.meta)+
      kpi('Прибыльные, на уровне цели (расчётная экономика)', s.profitable_n, 'расходы частично оценочные/распределённые, см. пояснение ниже', null, s.meta)+
      kpi('Расчётно убыточные SKU', s.loss_making_n, Dash.fmtRub(s.loss_sum_32d)+'/32д (расчёт)', 'neg', s.meta)+
      kpi('Требуют пересмотра цены/акции', s.review_needed_n, Dash.fmtRub(s.potential_improvement_target_32d)+'/32д (оценка до цели, все SKU)', null, s.meta)+
      kpi('Низкая маржа', s.low_margin_n, null, null, s.meta)+
      kpi('Недостаточно продаж за период', s.no_actual_sales_n, (s.returns_not_comparable_n?s.returns_not_comparable_n+' из них - возвраты > продаж в окне':null), null, s.meta)+
      kpi('Без себестоимости', s.no_cost_n, null, null, s.meta)+
      kpi('Целевой ДРР', s.target_drr_pct+'%', 'целевая маржа '+Dash.fmtPct(s.target_margin_pct), null, s.target_drr_meta)+
    '</div>' +
    '<p class="dim" style="font-size:11px;margin:4px 0 0">Потенциальное улучшение до безубыточности за 32д (сумма факт. '+
    'убытка всех убыточных SKU): <b>'+Dash.fmtRub(s.potential_improvement_breakeven_32d)+'</b>. Потенциальное улучшение '+
    'до целевой маржи (больше первого - цель не ноль, а целевая маржа компании): <b>'+Dash.fmtRub(s.potential_improvement_target_32d)+'</b>.</p>' +
    '<p class="dim" style="font-size:11px">Проверка знаменателя (раздел 4): '+
    (s.partition_check.ok_n)+' (расчётная экономика) + '+(s.partition_check.loss_making_n)+' (убыточные) + '+
    (s.partition_check.review_needed_n)+' (требуют пересмотра) + '+(s.partition_check.no_actual_sales_n)+
    ' (без продаж) = '+(s.partition_check.sum)+' — '+
    (s.partition_check.reconciles ? 'совпадает с общим количеством SKU в выборке ('+s.partition_check.base_n+').'
      : '<b>НЕ совпадает с '+s.partition_check.base_n+' — см. лог сборки.</b>')+'</p>'+
    '<p class="dim" style="font-size:11px">'+esc(s.price_history_scope_note||'')+'</p>'+
    buildDecomposition()+
    buildReconciliation(d.finance_reconciliation)+
    prHtml +
    '<h2>SKU</h2>'+
    '<p class="dim" style="font-size:11.5px;margin:0 0 6px">'+esc(d.category_filter_note||'')+
    ' Два РАЗНЫХ ПО ПРИРОДЕ показателя, не путать: <b>«Факт. цена реализации»</b> — результат УЖЕ ПРОШЕДШИХ продаж '+
    '(продажи за вычетом возвратов ÷ реализованное количество за вычетом возвратов, sku_realization_32d.json) - '+
    'исторический факт, не текущая цена продавца. <b>«Необх. цена реализации»/«Целевая»</b> — ПРОГНОЗ безубыточности '+
    'при ТЕКУЩЕЙ структуре расходов (FIX/PCT), НЕ команда установить такую цену в кабинете и НЕ то же самое, что '+
    'историческая цена выше — связь между price.price и фактической ценой реализации через акции Ozon не '+
    'установлена. Прибыль/убыток называется РАСЧЁТНОЙ (не «фактической») - логистика/эквайринг/прочие услуги '+
    'частично нормативные, см. «Из чего складывается «Комиссия всего»» и «Сверка с Финансы» ниже. «Убыток/32д '+
    '(расчёт)» и «До цели/32д (оценка)» — разные величины: убыток — то, что уже потеряно по расчёту; недобор до '+
    'цели — сколько ещё нужно ДОБАВИТЬ к прибыли, чтобы достичь целевой маржи компании (обычно больше убытка, '+
    'показывается для убыточных SKU тоже). «ОК (расчётная экономика, требует подтверждения расходов)» — '+
    'расчётная прибыль положительна и не ниже целевой маржи, НО часть статей расходов (эквайринг+прочие+реклама, '+
    'а где логистика распределена — и она) оценочные/распределённые, не факт по каждому SKU; сумма таких статей '+
    'НЕ является границей их возможной ошибки, поэтому знак прибыли здесь НЕ объявляется гарантированным.</p>'+
    '<div class="filters" id="filters"></div>'+
    '<div class="filters" id="catfilters"></div>'+
    '<div class="card scroll"><table><thead><tr>'+
    '<th>SKU/Артикул</th><th>Название</th><th>Категория</th><th>Факт. цена реализации (история)</th>'+
    '<th>Цена продавца (без Ozon-акции)</th><th>Прибыль/ед. (расчёт)</th><th>Прибыль/32д (расчёт, точно)</th>'+
    '<th>Необх. цена реализации (прогноз)</th><th>Целевая (прогноз)</th><th>ДРР факт</th><th>Безубыт. ДРР</th><th>Индекс</th>'+
    '<th>Продано (факт net)</th><th>Рекомендация</th><th>Убыток/32д (расчёт)</th><th>До цели/32д (оценка)</th>'+
    '</tr></thead><tbody id="rowsBody"></tbody></table></div>'+
    '<p class="dim" style="font-size:11px">'+esc(d.breakeven_drr_formula||'')+'</p>'+
    '<p class="dim" style="font-size:11px">'+esc(d.methodology_note||'')+'</p>'+
    buildPriceChanges(d.price_changes);

  document.getElementById('filters').innerHTML = ['Все','Расчётная реализация убыточна','Требуется пересмотр цены/акции','ОК (расчётная экономика, требует подтверждения расходов)','Недостаточно фактических продаж','Возвраты превышают продажи в окне (не сопоставимо)']
    .map(function(f){ return '<button data-f="'+f+'" class="'+(f===FILTER?'on':'')+'">'+f+'</button>'; }).join('');
  document.querySelectorAll('#filters button').forEach(function(b){
    b.onclick = function(){ FILTER=b.dataset.f; renderRows(); };
  });
  document.getElementById('catfilters').innerHTML = CATS.map(function(c){
    return '<button data-c="'+esc(c)+'" class="'+(c===CATEGORY?'on':'')+'">'+esc(c)+'</button>';
  }).join('');
  document.querySelectorAll('#catfilters button').forEach(function(b){
    b.onclick = function(){ CATEGORY=b.dataset.c; renderRows(); };
  });
  document.querySelectorAll('.reaction-btn').forEach(function(b){
    b.onclick = function(){ toggleReaction(b.dataset.group); };
  });
  renderRows();
}).catch(function(e){ Dash.showFatalError('content', ['pricing.json ('+e+')']); });

let openGroup = null;
function toggleReaction(group){
  openGroup = (openGroup===group) ? null : group;
  renderReactionPanel();
}
function reactionCard(group, label, g, cls){
  return '<button type="button" class="reaction-btn" data-group="'+group+'" aria-expanded="false">'+
    '<div class="lbl"><span>'+esc(label)+'</span><span>'+(openGroup===group?'▾':'▸')+'</span></div>'+
    '<div class="val small'+(cls?' '+cls:'')+'">'+g.n+'</div>'+
    (g.n ? '<div class="period">'+(g.effect_32d>0?'+':'')+Dash.fmtRub(g.effect_32d)+'/32д</div>' : '')+
    '</button>';
}
function renderReactionPanel(){
  const panel = document.getElementById('reactionPanel');
  if (!panel) return;
  document.querySelectorAll('.reaction-btn').forEach(function(b){
    b.setAttribute('aria-expanded', b.dataset.group===openGroup ? 'true' : 'false');
    b.querySelector('.lbl span:last-child').textContent = b.dataset.group===openGroup ? '▾' : '▸';
  });
  if (!openGroup){ panel.innerHTML = ''; return; }
  const g = window.__pr[openGroup];
  panel.innerHTML = '<p class="dim" style="font-size:12px;margin:8px 0 4px">Строк в списке: <b>'+
    g.rows.length+'</b> (совпадает с числом на карточке: <b>'+g.n+'</b>)</p>'+
    '<div class="card scroll"><table><thead><tr><th>SKU/Артикул</th><th>Название</th>'+
    '<th>Дата изменения</th><th>Цена продавца была</th><th>Цена продавца стала</th><th>Δ ₽</th><th>Δ %</th></tr></thead><tbody>'+
    g.rows.map(function(e){
      return '<tr><td>'+esc(e.artikul)+'</td><td class="wrap-cell">'+esc(e.name)+'</td>'+
        '<td>'+(e.change_date ? Dash.fmtDate(e.change_date) : Dash.naText(e.change_date_note))+'</td>'+
        '<td>'+Dash.fmtRub(e.old_price)+'</td><td>'+Dash.fmtRub(e.new_price)+'</td>'+
        '<td class="'+Dash.signClass(e.delta_abs||0)+'">'+(e.delta_abs>0?'+':'')+Dash.fmtRub(e.delta_abs)+'</td>'+
        '<td class="'+Dash.signClass(e.delta_abs||0)+'">'+(e.delta_pct>0?'+':'')+Dash.fmtPct(e.delta_pct)+'</td></tr>';
    }).join('') + '</tbody></table></div>';
}

function renderRows(){
  let rows = FILTER==='Все' ? ROWS : ROWS.filter(function(r){return r.action===FILTER;});
  if (CATEGORY!=='Все') rows = rows.filter(function(r){return r.category===CATEGORY;});
  rows = rows.slice(0,300);
  document.getElementById('rowsBody').innerHTML = rows.map(function(r){
    const noteTitle = r.returns_comparability_note ? ' title="'+esc(r.returns_comparability_note)+'"' : '';
    return '<tr'+noteTitle+'><td>'+esc(r.artikul)+'</td><td class="wrap-cell">'+esc(r.name)+'</td><td>'+esc(r.category||'—')+'</td>'+
      '<td>'+(r.actual_avg_price!=null?Dash.fmtRub(r.actual_avg_price):Dash.naText('нет фактических продаж за период'))+
      (r.returns_comparability_note?' <span class="badge grey" title="'+esc(r.returns_comparability_note)+'">возвраты?</span>':'')+'</td>'+
      '<td class="dim">'+(r.price_diag_seller_base!=null?Dash.fmtRub(r.price_diag_seller_base):'—')+'</td>'+
      '<td class="'+Dash.signClass(r.margin_now||0)+'">'+(r.margin_now!=null?Dash.fmtRub(r.margin_now):'—')+'</td>'+
      '<td class="'+Dash.signClass(r.actual_profit_32d||0)+'" title="'+
      (r.commission_actual_pct!=null?'факт. комиссия '+r.commission_actual_pct+'% выручки (живая ставка '+r.commission_pct_live+'%), эквайринг+прочие 4,95% (норматив)':'')+
      '">'+(r.actual_profit_32d!=null?Dash.fmtRub(r.actual_profit_32d):'—')+'</td>'+
      '<td>'+(r.breakeven_target!=null?Dash.fmtRub(r.breakeven_target):'—')+'</td>'+
      '<td>'+(r.target_price!=null?Dash.fmtRub(r.target_price):'—')+'</td>'+
      '<td>'+Dash.fmtPct(r.drr_fact)+'</td>'+
      '<td>'+(r.breakeven_drr!=null?Dash.fmtPct(r.breakeven_drr):'—')+(r.already_unprofitable_at_zero_ads?' <span class="badge bad">убыток без рекламы</span>':'')+'</td>'+
      '<td>'+esc(r.price_index_color||'—')+'</td><td>'+(r.qty_net_32d!=null?r.qty_net_32d:r.qty_32d)+'</td>'+
      '<td>'+actionBadge(r.action)+'</td>'+
      '<td>'+(r.actual_loss_32d?Dash.fmtRub(r.actual_loss_32d):'—')+'</td>'+
      '<td class="dim">'+(r.uplift_to_target_32d?Dash.fmtRub(r.uplift_to_target_32d):'—')+'</td></tr>';
  }).join('') || '<tr><td colspan="16" class="dim" style="text-align:center;padding:14px">Нет строк</td></tr>';
}
function actionBadge(a){
  const cls = a==='Расчётная реализация убыточна' ? 'bad' :
              a==='Требуется пересмотр цены/акции' ? 'risk' :
              a==='ОК (расчётная экономика, требует подтверждения расходов)' ? 'ok' : 'grey';
  return '<span class="badge '+cls+'">'+esc(a)+'</span>';
}
function buildDecomposition(){
  const rows = [
    ['Комиссия Ozon (факт)', 'sku_realization_32d.json → sku[].commission', 'Σ(standard_fee проданных строк − standard_fee возвращённых строк), /v1/finance/realization/by-day — корректировка возврата УЖЕ внутри суммы', 'actual'],
    ['Логистика', '2026-09-02_planirovshik_v3_recalc.csv → logistics_new/logistics_source', 'по каждому SKU: сверено с начислениями Ozon ОДНОКРАТНО на 2026-09-02 (не на текущее окно) либо тариф Антона', 'allocated / estimated'],
    ['Кросс-докинг', '…→ crossdock_new', '3,21% от закупки (структурный аудит 2026-09-02, не текущее окно)', 'allocated'],
    ['Хранение', 'расчёт: cost × 3%', 'нормативная ставка от себестоимости', 'estimated'],
    ['Последняя миля', '…→ last_mile', 'структурный аудит 2026-09-02 (не текущее окно)', 'allocated'],
    ['Эквайринг', 'константа EKV=1% от выручки', 'нормативная ставка — не доказано отсутствие пересечения с комиссией/логистикой (см. открытые вопросы сверки)', 'estimated'],
    ['Прочие услуги', 'константа PROC=3,95% от выручки', 'нормативная ставка — не доказано отсутствие пересечения с комиссией/логистикой (см. открытые вопросы сверки)', 'estimated'],
    ['Себестоимость', 'combined_cost_price.csv → cost_final', 'закуп + Ермек + упаковка, компания ведёт сама', 'actual'],
    ['Реклама', 'ads_sku_60d.json → cpc_expense', 'реальный расход Performance API за 60д, линейно масштабирован ×32/60 к окну — НЕ факт именно за эти 32 дня', 'allocated'],
  ];
  const trs = rows.map(function(r){
    return '<tr><td>'+esc(r[0])+'</td><td class="dim" style="font-size:11px">'+esc(r[1])+'</td>'+
      '<td class="dim" style="font-size:11px">'+esc(r[2])+'</td><td>'+esc(r[3])+'</td></tr>';
  }).join('');
  return '<h2>Из чего складывается «Комиссия всего» (методика)</h2>'+
    '<p class="dim" style="font-size:11.5px;margin:0 0 6px">Раньше единая цифра «Комиссия всего» (60,14%) была суммой '+
    'живой ставки комиссии (51%) и НОРМАТИВНЫХ надбавок, включая устаревшее дублирующее поле «кросс-докинг» и '+
    'норматив «возвраты» (двойной учёт с уже вычтенной фактической суммой возвратов) - оба удалены. Комиссия в '+
    'прибыли теперь берётся из уже собранной фактической суммы (не по ставке). actual — сумма напрямую '+
    'из операций Ozon; allocated — реальная сумма, но из разового аудита или другого окна (не текущих операций); '+
    'estimated — нормативная ставка без поэлементного факт. источника на SKU. Итоговая прибыль/убыток по SKU '+
    'называется «Расчётная» (calculated), не «фактическая» — совпадение общей суммы с контуром Финансы (см. '+
    'сверку ниже) само по себе не доказывает правильность распределения по конкретному SKU.</p>'+
    '<div class="card scroll"><table><thead><tr><th>Составляющая</th><th>Источник → поле</th><th>Формула/ставка</th>'+
    '<th>Тип</th></tr></thead><tbody>'+trs+'</tbody></table></div>';
}
function buildReconciliation(fr){
  if (!fr) return '';
  if (!fr.available) return '<h2>Сверка суммы по SKU с контуром Финансы</h2><p class="dim">'+esc(fr.note||'Недоступно')+'</p>';
  const trs = fr.rows.map(function(row){
    return '<tr><td>'+esc(row.label)+(row.comparable?' <span class="badge" title="Одинаковые даты и состав операций">сопоставимо</span>':' <span class="badge grey" title="Не подтверждена сопоставимость показателей">не сверено</span>')+'</td>'+
      '<td>'+(row.sku_sum!=null?Dash.fmtRub(row.sku_sum):Dash.naText('нет полного итога'))+'</td>'+
      '<td>'+(row.finance_sum!=null?Dash.fmtRub(row.finance_sum):Dash.naText('нет данных'))+'</td>'+
      '<td class="'+Dash.signClass(row.diff||0)+'">'+(row.diff!=null?((row.diff>0?'+':'')+Dash.fmtRub(row.diff)):'—')+
      (row.diff_pct!=null?' ('+(row.diff_pct>0?'+':'')+Dash.fmtPct(row.diff_pct)+')':'')+'</td>'+
      '<td class="dim wrap-cell" style="font-size:11px">'+esc(row.note||'')+'</td></tr>';
  }).join('');
  const oq = (fr.open_questions||[]).map(function(q){ return '<li>'+esc(q)+'</li>'; }).join('');
  return '<h2>Сверка суммы по SKU с независимо измеренным контуром Финансы</h2>'+
    '<p class="dim" style="font-size:11.5px;margin:0 0 6px">Окно SKU: '+esc(fr.sku_window.from)+' — '+esc(fr.sku_window.to)+
    ' ('+fr.sku_window.n_days+' дн.). Пересечение с историей Финансы: '+esc(fr.common_window.from)+' — '+
    esc(fr.common_window.to)+' ('+fr.common_window.n_days+' дн.'+
    (fr.common_window.excluded_sku_days&&fr.common_window.excluded_sku_days.length?', исключены дни окна SKU: '+fr.common_window.excluded_sku_days.map(Dash.fmtDate).join(', '):'')+
    '). Продажи сверены по магазину целиком; фильтр каталога не применяется'+
    '. '+esc(fr.note||'')+'</p>'+
    '<div class="card scroll"><table><thead><tr><th>Показатель</th><th>Сумма по SKU</th><th>Сумма в Финансах</th>'+
    '<th>Разница</th><th>Объяснение</th></tr></thead><tbody>'+trs+'</tbody></table></div>'+
    (oq?'<p class="dim" style="font-size:11.5px;margin:6px 0 0"><b>Открытые вопросы (не сняты):</b></p><ul class="dim" style="font-size:11.5px;margin:2px 0 0;padding-left:18px">'+oq+'</ul>':'');
}
function buildPriceChanges(pc){
  if (!pc || !pc.available) return '<h2>Было → стало (изменения цены)</h2><p class="dim">'+esc((pc&&pc.note)||'Нет данных')+'</p>';
  const trs = pc.rows.map(function(c){
    return '<tr><td>'+Dash.fmtDate(c.date)+'</td><td>'+esc(c.offer_id)+'</td><td class="wrap-cell">'+esc(c.name)+'</td>'+
      '<td>'+Dash.fmtRub(c.old_price)+'</td><td>'+Dash.fmtRub(c.new_price)+'</td>'+
      '<td class="'+Dash.signClass(c.delta_abs||0)+'">'+(c.delta_abs>0?'+':'')+Dash.fmtRub(c.delta_abs)+' ('+Dash.fmtPct(c.delta_pct)+')</td></tr>';
  }).join('');
  return '<h2>Цена продавца — было → стало (изменения за 30 дней)</h2>'+
    '<p class="dim" style="font-size:12px">Цена продавца по каталогу (Контур 2, диагностика — не фактическая цена '+
    'реализации). История ведётся с '+Dash.fmtDate(pc.tracking_started_from)+
    ' — более ранние изменения не восстановить. Всего записей: '+pc.n+'.</p>'+
    '<div class="card scroll"><table><thead><tr><th>Дата</th><th>Артикул</th><th>Название</th>'+
    '<th>Цена продавца была</th><th>Цена продавца стала</th><th>Дельта</th></tr></thead>'+
    '<tbody>'+trs+'</tbody></table></div>';
}
function kpi(label, val, sub, cls, meta){
  return '<div class="kpi"><div class="lbl">'+esc(label)+'</div><div class="val small'+(cls?' '+cls:'')+'">'+val+'</div>'+
    (sub?'<div class="period">'+esc(String(sub))+'</div>':'')+
    (meta ? Dash.renderMeta(meta) : '')+'</div>';
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
</script>
</body>
